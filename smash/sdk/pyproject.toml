[build-system]
requires = []
build-backend = "_se_build_backend"
backend-path = ["."]

[project]
name = "saltysd-sea"
version = "2.0.0.dev0"
description = "Build and inspect SALT Engine archives"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "capstone==5.0.9",
    "pyelftools==0.33",
]

[project.optional-dependencies]
test = [
    "hypothesis==6.155.6",
    "sortedcontainers==2.4.0",
]

[project.scripts]
saltysd-sea = "saltysd_sea:main"
